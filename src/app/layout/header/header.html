<header class="fixed top-0 w-full z-50 glass">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="text-xl font-bold text-accent-light tracking-wide">
      <span class="text-text-main">Lucas</span>Coutinho<span class="text-accent">.</span>
    </div>
    <div class="flex items-center space-x-6">
      <div class="hidden md:flex space-x-8 text-sm font-medium mr-4">
        <a href="#about" class="hover:text-accent-light transition-smooth">{{ translations().nav.about }}</a>
        <a href="#skills" class="hover:text-accent-light transition-smooth">{{ translations().nav.skills }}</a>
        <a href="#projects" class="hover:text-accent-light transition-smooth">{{ translations().nav.projects }}</a>
        <a href="#experience" class="hover:text-accent-light transition-smooth">{{ translations().nav.experience }}</a>
        <a href="#contact" class="hover:text-accent-light transition-smooth">{{ translations().nav.contact }}</a>
      </div>
      
      <div class="flex items-center space-x-3 border-l border-border pl-4">
        <button (click)="toggleLang()" class="font-mono font-bold text-sm text-text-muted hover:text-accent-light transition-smooth px-2" aria-label="Toggle Language">
          {{ currentLang() === 'pt' ? 'PT' : 'EN' }}
        </button>

        <button (click)="toggleTheme()" class="p-2 rounded-full hover:bg-surface-hover transition-smooth border border-border" aria-label="Toggle Dark Mode">
          @if (isDarkMode()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-accent-light" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-text-main" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>
      </div>
    </div>
  </nav>
</header>
