    <form action="https://formspree.io/f/xwvaayeo" method="POST" (submit)="handleSubmit($event)" class="space-y-4 mb-16 relative">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="name" [placeholder]="translations().footer.namePlaceholder" [attr.aria-label]="translations().footer.namePlaceholder" required class="w-full bg-primary border border-border rounded-md px-4 py-3 text-text-main focus:outline-none focus:ring-2 focus:ring-accent-light transition-smooth">
        <input type="email" name="_replyto" [placeholder]="translations().footer.emailPlaceholder" [attr.aria-label]="translations().footer.emailPlaceholder" required class="w-full bg-primary border border-border rounded-md px-4 py-3 text-text-main focus:outline-none focus:ring-2 focus:ring-accent-light transition-smooth">
      </div>
      <textarea name="message" rows="4" [placeholder]="translations().footer.messagePlaceholder" [attr.aria-label]="translations().footer.messagePlaceholder" required class="w-full bg-primary border border-border rounded-md px-4 py-3 text-text-main focus:outline-none focus:ring-2 focus:ring-accent-light transition-smooth"></textarea>
      
      <button type="submit" [disabled]="isSubmitting()" class="w-full bg-accent hover:bg-accent-light text-white font-medium py-3 rounded-md transition-smooth shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isSubmitting()) {
          <span class="animate-pulse">...</span>
        } @else {
          {{ translations().footer.sendButton }}
        }
      </button>

      @if (formStatus() === FormStatus.Success) {
        <div class="absolute -bottom-10 left-0 w-full text-center text-green-500 font-medium">
          {{ translations().footer.successMessage }}
        </div>
      }
      @if (formStatus() === FormStatus.Error) {
        <div class="absolute -bottom-10 left-0 w-full text-center text-red-500 font-medium">
          {{ translations().footer.errorMessage }}
        </div>
      }
    </form>
