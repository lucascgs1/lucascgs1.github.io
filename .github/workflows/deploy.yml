name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Caso sua branch principal seja master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Instalar dependências
        run: pnpm install

      - name: Build do projeto
        # O base-href precisa ser igual ao nome do repositório no GitHub para os assets carregarem certo
        run: pnpm run build --base-href /portfolio/

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Nas versões mais novas do Angular (builder de aplicação), o build vai para dist/portfolio/browser
          # Se o seu builder for mais antigo ou estiver diferente, pode ser apenas dist/portfolio
          publish_dir: ./dist/portfolio/browser
